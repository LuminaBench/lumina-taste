<!doctype html>
<html lang="en" data-palette="petrol-peach" data-mode="light" data-type="financial" data-density="balanced" data-radius="soft" data-motion="snappy" data-app>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halyard Ferries · phone app</title>
  <meta name="description" content="Blueprint: a ferry app's whole flow as phone screens (choose a harbour, today's sailings, one sailing with a tickets sheet, checkout, tickets, settings), side by side on a desktop and one at a time on a phone, built with lumina-taste.">
</head>
<body>
  <a class="bp-skip" href="#main">Skip to content</a>
  <main id="main" class="ap">
    <header class="ap-head">
      <h1>Halyard Ferries, on a phone</h1>
      <p>Six screens from choosing a harbour to a paid ticket. Every control works: tap through, drag, or use the keyboard.</p>
      <div class="ap-pager">
        <button type="button" class="lt-btn" data-variant="secondary" data-icon-only id="ap-prev" aria-label="Previous screen"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <button type="button" class="lt-btn" data-variant="secondary" data-icon-only id="ap-next" aria-label="Next screen"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
    </header>

    <div class="ap-rail" id="ap-rail" role="region" aria-label="App screens" tabindex="0">

      <!-- 1 · Choose a harbour -->
      <figure class="ap-frame" id="screen-start" data-screen="start">
        <div class="ap-device">
          <div class="ap-status" aria-hidden="true"><span>9:41</span><span class="ap-status-icons"><i></i><i></i><i></i></span></div>
          <section class="ap-screen" aria-labelledby="st-h">
            <div class="ap-scroll ap-start">
              <div class="ap-board" data-tone="dark" role="img" aria-label="Departures from Ardmore: 08:40 to Kestrel Isle, on time. 10:15 to Larkspur Bay, on time. 12:30 to Kestrel Isle, 10 minutes late.">
                <p><span>Ardmore</span><span>Departures</span></p>
                <ol>
                  <li><b>08:40</b><span>Kestrel Isle</span><em>On time</em></li>
                  <li><b>10:15</b><span>Larkspur Bay</span><em>On time</em></li>
                  <li><b>12:30</b><span>Kestrel Isle</span><em data-late>+10 min</em></li>
                </ol>
              </div>
              <h2 id="st-h" class="ap-title" tabindex="-1">Every sailing from your harbour, live</h2>
              <p class="ap-lede">Pick where you sail from. You can change it in Settings.</p>
              <ul class="ap-choices" aria-label="Harbours">
                <li><button type="button" data-harbour="Ardmore" data-go="home"><span><b>Ardmore</b><small>To Kestrel Isle and Larkspur Bay</small></span><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></li>
                <li><button type="button" data-harbour="Kestrel Isle" data-go="home"><span><b>Kestrel Isle</b><small>To Ardmore</small></span><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></li>
                <li><button type="button" data-harbour="Larkspur Bay" data-go="home"><span><b>Larkspur Bay</b><small>To Ardmore</small></span><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></li>
              </ul>
            </div>
          </section>
        </div>
        <figcaption><b>Choose a harbour.</b> A tap goes straight on: no Continue button.</figcaption>
      </figure>

      <!-- 2 · Today -->
      <figure class="ap-frame" id="screen-home" data-screen="home">
        <div class="ap-device">
          <div class="ap-status" aria-hidden="true"><span>9:41</span><span class="ap-status-icons"><i></i><i></i><i></i></span></div>
          <section class="ap-screen" aria-labelledby="home-h">
            <div class="ap-scroll">
              <header class="lt-appbar" data-lt="mobile-app-bar" data-size="large">
                <div data-part="row"><span></span><p data-part="small" aria-hidden="true">Today</p><button type="button" data-part="action" data-go="start" data-dir="back" id="ap-harbour" aria-label="Change harbour, now Ardmore">Ardmore</button></div>
                <h2 data-part="large" id="home-h" tabindex="-1">Today</h2>
              </header>
              <div class="ap-body">
                <div class="lt-segmented ap-seg" data-lt="segmented-control" role="radiogroup" aria-label="Where to" id="ap-dest">
                  <span data-part="indicator" aria-hidden="true"></span>
                  <button type="button" role="radio" aria-checked="true" tabindex="0" data-value="kestrel">Kestrel Isle</button>
                  <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="larkspur">Larkspur Bay</button>
                </div>
                <div class="lt-pull" data-lt="pull-refresh" id="ap-pull">
                  <div data-part="indicator" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9" data-part="track"/><circle cx="12" cy="12" r="9" data-part="arc" pathLength="1"/></svg></div>
                  <div data-part="body">
                    <p data-part="stamp"><span data-part="when">Updated 09:38</span><button type="button" data-part="refresh"><svg class="lt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6L20 8.5M20 4v4.5h-4.5"/></svg><span>Refresh</span></button></p>
                    <div data-view="ready" class="ap-today">
                      <a class="ap-next" href="#screen-sailing" data-go="sailing">
                        <span class="ap-next-when">Next sailing · leaves in <span id="ap-mins">24</span> min</span>
                        <b class="ap-next-time" id="ap-next-time">08:40</b>
                        <span class="ap-next-route" id="ap-next-route">Ardmore to Kestrel Isle</span>
                        <span class="ap-next-meta"><span class="lt-badge" data-tone="positive" data-dot>On time</span><span>MV Juniper · Gate 2</span></span>
                        <span class="ap-deck"><span>Car deck</span><span class="ap-meter" aria-hidden="true"><i style="--v: 82%"></i></span><span>82% full</span></span>
                      </a>
                      <h3 class="ap-section">Later today</h3>
                      <div class="lt-swiperow ap-rows" data-lt="swipe-row" id="ap-later">
                        <ul data-part="list" aria-label="Later sailings">
                          <li data-part="row" data-id="1015" data-dest="larkspur"><div data-part="content"><a data-part="main" href="#screen-sailing" data-go="sailing"><b data-part="lead">10:15</b><span data-part="title">Larkspur Bay</span><span data-part="sub">MV Kestrel · 55 min</span><span data-part="meta">£9.50</span></a><button type="button" data-part="more" aria-expanded="false" aria-controls="ap-a1015" aria-label="Actions for the 10:15 to Larkspur Bay"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18.5" cy="12" r="1"/></svg></button></div><div data-part="actions" id="ap-a1015"><button type="button" data-action="remind"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15ZM10 20.5a2 2 0 0 0 4 0"/></svg><span>Remind</span></button><button type="button" data-action="share"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>Share</span></button></div></li>
                          <li data-part="row" data-id="1230" data-dest="kestrel"><div data-part="content"><a data-part="main" href="#screen-sailing" data-go="sailing"><b data-part="lead">12:30</b><span data-part="title">Kestrel Isle</span><span data-part="sub">MV Juniper · 1 h 25 min</span><span data-part="meta">£12.50</span></a><button type="button" data-part="more" aria-expanded="false" aria-controls="ap-a1230" aria-label="Actions for the 12:30 to Kestrel Isle"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18.5" cy="12" r="1"/></svg></button></div><div data-part="actions" id="ap-a1230"><button type="button" data-action="remind"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15ZM10 20.5a2 2 0 0 0 4 0"/></svg><span>Remind</span></button><button type="button" data-action="share"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>Share</span></button></div></li>
                          <li data-part="row" data-id="1445" data-dest="kestrel"><div data-part="content"><a data-part="main" href="#screen-sailing" data-go="sailing"><b data-part="lead">14:45</b><span data-part="title">Kestrel Isle</span><span data-part="sub">MV Moss · 1 h 30 min</span><span data-part="meta"><span class="lt-badge" data-tone="warning">15 min late</span></span></a><button type="button" data-part="more" aria-expanded="false" aria-controls="ap-a1445" aria-label="Actions for the 14:45 to Kestrel Isle"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18.5" cy="12" r="1"/></svg></button></div><div data-part="actions" id="ap-a1445"><button type="button" data-action="remind"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15ZM10 20.5a2 2 0 0 0 4 0"/></svg><span>Remind</span></button><button type="button" data-action="share"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>Share</span></button></div></li>
                          <li data-part="row" data-id="1710" data-dest="larkspur"><div data-part="content"><a data-part="main" href="#screen-sailing" data-go="sailing"><b data-part="lead">17:10</b><span data-part="title">Larkspur Bay</span><span data-part="sub">MV Kestrel · 55 min</span><span data-part="meta">£9.50</span></a><button type="button" data-part="more" aria-expanded="false" aria-controls="ap-a1710" aria-label="Actions for the 17:10 to Larkspur Bay"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18.5" cy="12" r="1"/></svg></button></div><div data-part="actions" id="ap-a1710"><button type="button" data-action="remind"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15ZM10 20.5a2 2 0 0 0 4 0"/></svg><span>Remind</span></button><button type="button" data-action="share"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>Share</span></button></div></li>
                          <li data-part="row" data-id="1930" data-dest="kestrel"><div data-part="content"><a data-part="main" href="#screen-sailing" data-go="sailing"><b data-part="lead">19:30</b><span data-part="title">Kestrel Isle</span><span data-part="sub">MV Juniper · last sailing</span><span data-part="meta">£12.50</span></a><button type="button" data-part="more" aria-expanded="false" aria-controls="ap-a1930" aria-label="Actions for the 19:30 to Kestrel Isle"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18.5" cy="12" r="1"/></svg></button></div><div data-part="actions" id="ap-a1930"><button type="button" data-action="remind"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15ZM10 20.5a2 2 0 0 0 4 0"/></svg><span>Remind</span></button><button type="button" data-action="share"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>Share</span></button></div></li>
                        </ul>
                        <p data-part="live" role="status" class="lt-visually-hidden"></p>
                      </div>
                    </div>
                    <div data-view="loading" class="ap-today" aria-busy="true" aria-label="Loading sailings" hidden>
                      <div class="ap-next ap-skel"><span class="lt-skeleton" style="width: 52%"></span><span class="lt-skeleton ap-skel-time"></span><span class="lt-skeleton" style="width: 64%"></span><span class="lt-skeleton" style="width: 100%"></span></div>
                      <ul class="ap-skels"><li><span class="lt-skeleton ap-skel-lead"></span><span class="lt-skeleton" style="width: 60%"></span></li><li><span class="lt-skeleton ap-skel-lead"></span><span class="lt-skeleton" style="width: 48%"></span></li><li><span class="lt-skeleton ap-skel-lead"></span><span class="lt-skeleton" style="width: 56%"></span></li><li><span class="lt-skeleton ap-skel-lead"></span><span class="lt-skeleton" style="width: 44%"></span></li></ul>
                    </div>
                    <section class="lt-empty ap-state" data-view="empty" aria-labelledby="ap-empty-h" hidden>
                      <span data-part="icon" aria-hidden="true"><svg class="lt-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></span>
                      <h3 id="ap-empty-h">No more sailings today</h3>
                      <p>The first one tomorrow leaves Ardmore at 07:10.</p>
                      <div data-part="actions"><button type="button" class="lt-btn" data-variant="secondary" data-set-state="ready"><span data-part="label">See tomorrow</span></button></div>
                    </section>
                    <section class="lt-empty ap-state" data-view="error" aria-labelledby="ap-error-h" hidden>
                      <span data-part="icon" aria-hidden="true"><svg class="lt-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 4.3 2.9 17.2A2 2 0 0 0 4.6 20h14.8a2 2 0 0 0 1.7-2.8L13.7 4.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4M12 17h.01"/></svg></span>
                      <h3 id="ap-error-h">Can’t reach the timetable</h3>
                      <p>You look offline. These times are from 09:12 and may have changed.</p>
                      <div data-part="actions"><button type="button" class="lt-btn" data-variant="secondary" data-set-state="ready"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6L20 8.5M20 4v4.5h-4.5"/></svg><span data-part="label">Try again</span></button></div>
                    </section>
                  </div>
                  <p data-part="live" role="status" class="lt-visually-hidden"></p>
                </div>
              </div>
            </div>
            <nav class="lt-bottom-nav ap-tabs" data-lt="bottom-nav" aria-label="Tabs">
              <span data-part="pill" aria-hidden="true"></span>
              <a href="#screen-home" aria-current="page"><svg class="lt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Today</span></a>
              <a href="#screen-tickets"><svg class="lt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg><span>Tickets</span></a>
              <a href="#screen-settings"><svg class="lt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg><span>Settings</span></a>
            </nav>
          </section>
        </div>
        <figcaption><b>Today.</b> Pull down to refresh. Swipe a sailing left to set a reminder.</figcaption>
      </figure>

      <!-- 3 · One sailing, with the tickets sheet -->
      <figure class="ap-frame" id="screen-sailing" data-screen="sailing">
        <div class="ap-device">
          <div class="ap-status" aria-hidden="true"><span>9:41</span><span class="ap-status-icons"><i></i><i></i><i></i></span></div>
          <section class="ap-screen" aria-labelledby="sail-h">
            <div class="ap-scroll">
              <header class="lt-appbar" data-lt="mobile-app-bar" data-size="large">
                <div data-part="row"><button type="button" data-part="back" data-go="home" data-dir="back" aria-label="Back to Today"><svg class="lt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg><span>Today</span></button><p data-part="small" aria-hidden="true">08:40 to Kestrel Isle</p><span></span></div>
                <h2 data-part="large" id="sail-h" tabindex="-1">08:40 to Kestrel Isle</h2>
              </header>
              <div class="ap-body">
                <ol class="ap-crossing" aria-label="The crossing">
                  <li><time>08:40</time><span><b>Ardmore</b><small>Gate 2 · boarding from 08:10</small></span></li>
                  <li data-leg><span>1 h 25 min at sea</span></li>
                  <li><time>10:05</time><span><b>Kestrel Isle</b><small>Pier 1 · buses meet the boat</small></span></li>
                </ol>
                <dl class="ap-facts">
                  <div><dt>Car deck</dt><dd><span class="ap-meter" aria-hidden="true"><i style="--v: 82%"></i></span><span>82% full</span></dd></div>
                  <div><dt>Foot passengers</dt><dd><span class="ap-meter" aria-hidden="true"><i style="--v: 47%"></i></span><span>140 of 300</span></dd></div>
                  <div><dt>Ship</dt><dd>MV Juniper</dd></div>
                  <div><dt>On board</dt><dd>Café, quiet lounge, dog deck</dd></div>
                </dl>
              </div>
            </div>
            <div class="ap-actionbar">
              <p><b>£12.50</b><span>per adult</span></p>
              <button type="button" class="lt-btn" data-variant="primary" data-size="lg" id="ap-choose" aria-haspopup="dialog"><span data-part="label">Choose tickets</span></button>
            </div>
          </section>
          <div data-lt="bottom-sheet" class="ap-sheet-root">
            <dialog class="lt-sheet ap-sheet" id="ap-sheet" data-detents="medium large" aria-labelledby="ap-sheet-h">
              <button type="button" data-part="grab" aria-label="Make the sheet bigger" aria-expanded="false"><span></span></button>
              <div class="ap-sheet-head"><h2 id="ap-sheet-h">Tickets for the 08:40</h2><button type="button" class="lt-btn" data-variant="ghost" data-part="cancel"><span data-part="label">Close</span></button></div>
              <div class="ap-ticketform">
                <div class="lt-stepper ap-stepper" data-lt="number-stepper">
