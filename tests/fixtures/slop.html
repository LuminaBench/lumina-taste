<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deliberately sloppy page (auditor fixture)</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .hero { padding: 48px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
  .hero h1 { background: linear-gradient(90deg, #ff6ec4, #7873f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { margin: 24px; padding: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.45); }
  .faint { color: #bbb; background: #fff; }
  .wide { width: 1800px; height: 10px; background: #eee; }
  .clip { width: 80px; overflow: hidden; white-space: nowrap; }
  .stack { position: relative; height: 40px; }
  .stack span { position: absolute; left: 0; top: 0; }
  button.noring:focus { outline: none; }
  td { font-variant-numeric: normal; }
</style>
</head>
<body>
  <section class="hero"><h1>Supercharge your workflow</h1></section>
  <div class="card">
    <p class="faint">This grey text is too faint to read.</p>
    <button type="button" class="noring">🚀 Launch</button>
    <a href="#">Learn more</a>
    <table><tr><td>1,284</td><td>£24,400</td></tr></table>
    <div class="clip">This sentence is cut off mid-word</div>
    <div class="stack"><span>Overlapping label one</span><span>Second label on top</span></div>
  </div>
  <div class="wide"></div>
</body>
</html>
