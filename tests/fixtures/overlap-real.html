<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kestrel tide tables</title>
<!-- Letters that really sit on letters: a figure that wraps into its caption, and a label pulled up over a heading.
     The overlap rule must still fail this page with the same tall face as overlap-tall-metrics.html. Used by
     tests/unit/critic.test.mjs. -->
<style>
  @font-face { font-family: "Tall Sans"; src: local("Helvetica Neue"), local("Helvetica"), local("Arial"), local("Liberation Sans"), local("DejaVu Sans"); ascent-override: 150%; descent-override: 70%; line-gap-override: 0%; }
  body { margin: 0; padding: 48px 32px; font: 16px/1.5 "Tall Sans", sans-serif; color: #1d232a; background: #f6f7f8; }
  .panel { position: relative; width: 220px; height: 150px; }
  .panel b { display: block; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
  .panel span { position: absolute; left: 4px; top: 40px; font-size: 22px; line-height: 1.2; }
  h2 { margin: 48px 0 0; font-size: 40px; line-height: 1.1; }
  .tag { display: block; margin-top: -34px; margin-left: 12px; font-size: 20px; }
</style></head>
<body><main>
  <div class="panel"><b>1,240</b><span>degrees in the kiln</span></div>
  <h2>Tide tables</h2>
  <p class="tag">Updated 06:00</p>
</main></body></html>
