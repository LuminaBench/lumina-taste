<!doctype html>
<html lang="en" data-palette="black-signal" data-mode="dark" data-type="stamped" data-density="balanced" data-radius="balanced" data-motion="snappy" data-style="studio">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumina Taste</title>
  <meta name="description" content="Every UI element, chart and page pattern by its real name, live in 36 themes, with the code and a prompt your agent can build from.">
  <!-- The theme and its typeface are settled before the first paint: the last choice (or the default) is put on
       <html> and its web font is asked for here, render-blocking, so the page never shows a stand-in look first. -->
  <script>(()=>{const F=/*FONTS*/{};const e=document.documentElement;try{const s=JSON.parse(localStorage.getItem("lt-gallery")||"{}");if(s.v===2)for(const k of ["palette","mode","type","density","radius","motion","style"])if(typeof s[k]==="string"&&/^[a-z-]+$/.test(s[k]))e.dataset[k]=s[k]}catch{}const u=F[e.dataset.type];if(u)document.write('<link rel="stylesheet" href="'+u+'" data-lt-font="'+e.dataset.type+'">')})()</script>
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0e0e0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <a class="g-skip" href="#g-main">Skip to content</a>
  <header class="g-top">
    <div class="g-top-in">
      <a class="g-brand" href="#/"><span class="g-brand-mark" aria-hidden="true"><i></i><i></i></span><span>lumina<b>taste</b></span></a>
      <nav class="g-nav" aria-label="Sections">
        <a href="#/" data-route="ui">Elements</a>
        <a href="#/charts" data-route="charts">Charts</a>
        <a href="#/styles" data-route="styles">Styles</a>
        <a href="#/pages" data-route="pages">Pages</a>
        <a href="#/first-screens" data-route="first-screens">First screens</a>
        <a href="#/palettes" data-route="palettes">Palettes</a>
        <a href="#/compare" data-route="compare">Compare</a>
        <a href="#/moments" data-route="moments">Moments</a>
        <a href="#/before-after" data-route="before-after">Before / after</a>
      </nav>
      <div class="g-search" role="search">
        <svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <label class="lt-visually-hidden" for="g-q">Describe the thing you are looking for</label>
        <input id="g-q" type="search" placeholder="Describe the thing…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="g-results" aria-autocomplete="list">
        <kbd aria-hidden="true">⌘K</kbd>
        <div class="g-results" id="g-results" role="listbox" aria-label="Search results" hidden></div>
      </div>
      <div class="g-top-tools">
        <button type="button" class="g-icon-btn" id="g-theme-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="g-theme"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2a1.7 1.7 0 0 1 1.2-2.9h2a4.1 4.1 0 0 0 4.1-4.1C20.5 6.9 16.7 3.5 12 3.5Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><span>Theme</span></button>
        <button type="button" class="g-icon-btn g-mode-btn" id="g-mode" aria-label="Switch to light mode"><svg class="lt-icon g-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><svg class="lt-icon g-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
      </div>
    </div>
    <div class="g-theme" id="g-theme" role="dialog" aria-label="Theme" hidden></div>
  </header>
  <main id="g-main" class="g-main" tabindex="-1"></main>
  <footer class="g-foot">
    <span>lumina-taste 1.0</span>
    <span><a href="https://github.com/LuminaBench/lumina-taste">GitHub</a> · <a href="https://luminabench.com">LuminaBench</a></span>
  </footer>
  <div class="g-announcer lt-visually-hidden" role="status" aria-live="polite"></div>
  <script type="module" src="./gallery.js"></script>
</body>
</html>
