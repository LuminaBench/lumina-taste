<div class="lt-query" data-lt="query-builder">
  <div data-part="group" data-depth="0">
    <div data-part="group-head">
      <span>Match</span>
      <div class="lt-segmented" data-part="logic" role="radiogroup" aria-label="Combine rules with"><span data-part="indicator" aria-hidden="true"></span><button type="button" role="radio" aria-checked="true" tabindex="0" data-value="AND">All (AND)</button><button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="OR">Any (OR)</button></div>
      <span>of these rules</span>
    </div>
    <ol data-part="rules"></ol>
    <div data-part="group-actions">
      <button type="button" data-part="add-rule"><svg class="lt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add rule</button>
      <button type="button" data-part="add-group"><svg class="lt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 8.5 4.5L12 13 3.5 8.5Z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></svg>Add group</button>
    </div>
  </div>
  <output data-part="preview" aria-live="polite"></output>
</div>
