<div class="lt-drawer-demo" data-lt="drawer">
  <button type="button" class="lt-btn" data-variant="secondary" data-part="open"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8Z"/></svg><span data-part="label">Filters</span></button>
  <dialog class="lt-drawer" aria-labelledby="lt-drawer-h">
    <header data-part="head"><h2 id="lt-drawer-h">Filters</h2><button type="button" data-part="close" aria-label="Close filters"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div data-part="body">
      <fieldset><legend>Status</legend>
        <label><input type="checkbox" checked> Active</label>
        <label><input type="checkbox"> Paused</label>
        <label><input type="checkbox"> Archived</label>
      </fieldset>
      <fieldset><legend>Owner</legend>
        <label><input type="radio" name="lt-dr-owner" checked> Anyone</label>
        <label><input type="radio" name="lt-dr-owner"> Me</label>
      </fieldset>
    </div>
    <footer data-part="foot">
      <button type="button" class="lt-btn" data-variant="ghost" data-part="reset"><span data-part="label">Reset</span></button>
      <button type="button" class="lt-btn" data-variant="primary" data-part="apply"><span data-part="label">Show 128 results</span></button>
    </footer>
  </dialog>
</div>
