<div class="lt-shortcuts-demo" data-lt="shortcuts-sheet">
  <button type="button" class="lt-btn" data-variant="secondary" data-part="open"><kbd class="lt-kbd">?</kbd> Keyboard shortcuts</button>
  <dialog class="lt-shortcuts" aria-labelledby="lt-ks-title">
    <header><h3 id="lt-ks-title">Keyboard shortcuts</h3><button type="button" data-part="close" aria-label="Close"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <label data-part="filter"><span class="lt-visually-hidden">Filter shortcuts</span><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input type="search" placeholder="Filter shortcuts"></label>
    <div data-part="groups"><section><h4>General</h4><dl><div><dt>Search</dt><dd><kbd class="lt-kbd">⌘</kbd><kbd class="lt-kbd">K</kbd></dd></div><div><dt>Show shortcuts</dt><dd><kbd class="lt-kbd">?</kbd></dd></div><div><dt>Close</dt><dd><kbd class="lt-kbd">Esc</kbd></dd></div></dl></section><section><h4>Navigation</h4><dl><div><dt>Go to Inbox</dt><dd><kbd class="lt-kbd">G</kbd><kbd class="lt-kbd">I</kbd></dd></div><div><dt>Go to Reports</dt><dd><kbd class="lt-kbd">G</kbd><kbd class="lt-kbd">R</kbd></dd></div><div><dt>Next item</dt><dd><kbd class="lt-kbd">J</kbd></dd></div><div><dt>Previous item</dt><dd><kbd class="lt-kbd">K</kbd></dd></div></dl></section><section><h4>Editing</h4><dl><div><dt>Bold</dt><dd><kbd class="lt-kbd">⌘</kbd><kbd class="lt-kbd">B</kbd></dd></div><div><dt>Save</dt><dd><kbd class="lt-kbd">⌘</kbd><kbd class="lt-kbd">S</kbd></dd></div><div><dt>Undo</dt><dd><kbd class="lt-kbd">⌘</kbd><kbd class="lt-kbd">Z</kbd></dd></div></dl></section></div>
  </dialog>
</div>
