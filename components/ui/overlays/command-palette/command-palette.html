<div class="lt-cmdk-demo" data-lt="command-palette">
  <button type="button" class="lt-btn" data-variant="secondary" data-part="open"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3Z"/></svg><span data-part="label">Open command palette</span><kbd class="lt-kbd">⌘K</kbd></button>

    <div data-part="search"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input type="text" role="combobox" aria-expanded="true" aria-controls="lt-cmdk-list" aria-autocomplete="list" placeholder="Type a command or search…" autocomplete="off" spellcheck="false"><kbd class="lt-kbd">Esc</kbd></div>
    <div data-part="list" id="lt-cmdk-list" role="listbox" aria-label="Commands">
      <div role="group" aria-labelledby="lt-cmdk-g1"><p id="lt-cmdk-g1" data-part="group">Suggestions</p>
        <div role="option" id="lt-cmdk-1" data-keywords="new create issue ticket"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Create issue</span><kbd class="lt-kbd">C</kbd></div>
        <div role="option" id="lt-cmdk-2" data-keywords="search find docs"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>Search documentation</span><kbd class="lt-kbd">/</kbd></div>
        <div role="option" id="lt-cmdk-3" data-keywords="theme dark light mode toggle"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><span>Toggle dark mode</span></div>
      </div>
      <div role="group" aria-labelledby="lt-cmdk-g2"><p id="lt-cmdk-g2" data-part="group">Navigation</p>
        <div role="option" id="lt-cmdk-4" data-keywords="go inbox messages"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 13.5 6 5.5h12l2.5 8V18a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/><path d="M3.5 13.5H8l1.5 2.5h5l1.5-2.5h4.5"/></svg><span>Go to Inbox</span><span data-part="seq"><kbd class="lt-kbd">G</kbd><kbd class="lt-kbd">I</kbd></span></div>
        <div role="option" id="lt-cmdk-5" data-keywords="go reports analytics charts"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4M4 20h16M8.5 16v-5M13 16V8M17.5 16v-3"/></svg><span>Go to Reports</span><span data-part="seq"><kbd class="lt-kbd">G</kbd><kbd class="lt-kbd">R</kbd></span></div>

        <div role="option" id="lt-cmdk-7" data-keywords="invite team member people"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.25"/><path d="M3 20a6 6 0 0 1 12 0M16 4.8a3.25 3.25 0 0 1 0 6.4M17.5 14.2A6 6 0 0 1 21 20"/></svg><span>Invite teammates</span></div>

    <div data-part="foot"><span><kbd class="lt-kbd">↑</kbd><kbd class="lt-kbd">↓</kbd> to navigate</span><span><kbd class="lt-kbd">↵</kbd> to run</span></div>
  </dialog>
</div>
