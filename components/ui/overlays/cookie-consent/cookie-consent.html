<div class="lt-consent lt-consent-demo" data-lt="cookie-consent">
  <div data-part="page" aria-hidden="true"><span></span><span></span><span></span></div>
  <section data-part="banner" role="region" aria-labelledby="lt-consent-title">
    <div data-part="main">
      <h4 id="lt-consent-title">Cookies</h4>
      <p>We use essential cookies to run the site. With your OK we also measure which pages are useful. No ads, no selling data.</p>
    </div>
    <div data-part="prefs" hidden>
      <label><input type="checkbox" checked disabled> Essential <span>Always on</span></label>
      <label><input type="checkbox" name="analytics"> Analytics <span>Page views, no personal data</span></label>
    </div>
    <div data-part="actions">
      <button type="button" class="lt-btn" data-variant="ghost" data-part="customise" aria-expanded="false">Customise</button>
      <button type="button" class="lt-btn" data-variant="secondary" data-choice="essential">Essential only</button>
      <button type="button" class="lt-btn" data-variant="secondary" data-choice="all">Accept all</button>
    </div>
  </section>
  <p data-part="done" role="status" hidden></p>
</div>
