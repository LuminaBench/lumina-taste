<div class="lt-billing" data-lt="billing-toggle">
  <div data-part="switch" role="radiogroup" aria-label="Billing period">
    <span data-part="indicator" aria-hidden="true"></span>
    <button type="button" role="radio" aria-checked="false" data-period="monthly">Monthly</button>
    <button type="button" role="radio" aria-checked="true" data-period="yearly">Yearly <span data-part="save">Save 20%</span></button>
  </div>
  <div data-part="plan">
    <p data-part="name">Team</p>
    <p data-part="price"><span data-price data-monthly="£24" data-yearly="£19">£19</span><span data-part="per">per seat / month</span></p>
    <p data-part="note" data-monthly="Billed monthly. Cancel any time." data-yearly="Billed £228 yearly per seat.">Billed £228 yearly per seat.</p>
  </div>
</div>
