<div class="lt-dual-range" data-lt="dual-range-slider" data-prefix="£" data-gap="50">
  <div data-part="head"><span id="lt-dr-label">Price</span><output data-part="readout">£200 – £800</output></div>
  <div data-part="track"><span data-part="fill"></span>
    <input type="range" min="0" max="1000" step="10" value="200" aria-labelledby="lt-dr-label" aria-label="Minimum price">
    <input type="range" min="0" max="1000" step="10" value="800" aria-labelledby="lt-dr-label" aria-label="Maximum price">
  </div>
  <div data-part="scale" aria-hidden="true"><span>£0</span><span>£1,000</span></div>
</div>
