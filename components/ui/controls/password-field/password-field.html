<div class="lt-password" data-lt="password-field">
  <label for="lt-pw">New password</label>
  <div data-part="box"><input id="lt-pw" type="password" autocomplete="new-password" aria-describedby="lt-pw-rules lt-pw-strength"><button type="button" data-part="reveal" aria-pressed="false" aria-label="Show password"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div data-part="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p id="lt-pw-strength" data-part="strength" aria-live="polite">Weak</p>
  <ul id="lt-pw-rules" data-part="rules">
    <li data-rule="len">At least 12 characters</li>
    <li data-rule="mix">Upper and lower case</li>
    <li data-rule="num">A number or symbol</li>
  </ul>
</div>
