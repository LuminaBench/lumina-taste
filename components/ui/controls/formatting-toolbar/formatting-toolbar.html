<div class="lt-format" data-lt="formatting-toolbar">

    </div>
    <span data-part="sep" aria-hidden="true"></span>
    <button type="button" data-cmd="link" tabindex="-1" aria-label="Add link" title="Link (⌘K)"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>

  <p id="lt-format-text" data-part="text" data-bold>Quarterly numbers close on Friday. Send corrections before Thursday noon.</p>
