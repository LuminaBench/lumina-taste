<div class="lt-setgroups" data-lt="settings-group">
  <label data-part="search"><svg class="lt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off"></label>
  <section data-part="group" aria-labelledby="lt-sg-1">
    <h3 id="lt-sg-1">Notifications</h3>
    <ul>
      <li data-part="row"><label><span data-part="text"><span data-part="label">Payments in and out</span><span data-part="desc">The moment money moves</span></span><input type="checkbox" role="switch" checked></label></li>
      <li data-part="row"><label><span data-part="text"><span data-part="label">Weekly summary</span><span data-part="desc">Mondays at 08:00</span></span><input type="checkbox" role="switch"></label></li>
      <li data-part="row"><a href="#quiet"><span data-part="text"><span data-part="label">Quiet hours</span></span><span data-part="value">22:00 to 07:00</span></a></li>
    </ul>
  </section>
  <section data-part="group" aria-labelledby="lt-sg-2">
    <h3 id="lt-sg-2">Security</h3>
    <ul>
      <li data-part="row"><label><span data-part="text"><span data-part="label">Face to open the app</span></span><input type="checkbox" role="switch" checked></label></li>
      <li data-part="row"><a href="#devices"><span data-part="text"><span data-part="label">Signed-in devices</span></span><span data-part="value">2</span></a></li>
    </ul>
    <p data-part="note">You are asked again after 5 minutes away.</p>
  </section>
  <section data-part="group" data-tone="danger" aria-labelledby="lt-sg-3">
    <h3 id="lt-sg-3" class="lt-visually-hidden">Account</h3>
    <ul>
      <li data-part="row"><button type="button" data-part="danger">Close account</button></li>
    </ul>
  </section>
  <p data-part="empty" role="status" hidden>No settings match “<span></span>”.</p>
</div>
