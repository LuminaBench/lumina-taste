<div class="lt-mention" data-lt="mention-input">
  <label for="lt-mention-ta">Comment</label>
  <div data-part="wrap">
    <textarea id="lt-mention-ta" rows="3" role="combobox" aria-expanded="false" aria-controls="lt-mention-list" aria-autocomplete="list" aria-describedby="lt-mention-hint" placeholder="Type @ to mention someone"></textarea>
    <ul id="lt-mention-list" data-part="list" role="listbox" aria-label="People" hidden><li role="option" id="lt-mention-ana" data-handle="ana"><span data-part="avatar" aria-hidden="true">AL</span><span><strong>Ana López</strong><span>@ana</span></span></li><li role="option" id="lt-mention-kai" data-handle="kai"><span data-part="avatar" aria-hidden="true">KM</span><span><strong>Kai Moreno</strong><span>@kai</span></span></li><li role="option" id="lt-mention-lee" data-handle="lee"><span data-part="avatar" aria-hidden="true">LP</span><span><strong>Lee Park</strong><span>@lee</span></span></li><li role="option" id="lt-mention-riya" data-handle="riya"><span data-part="avatar" aria-hidden="true">RM</span><span><strong>Riya Mehta</strong><span>@riya</span></span></li><li role="option" id="lt-mention-sam" data-handle="sam"><span data-part="avatar" aria-hidden="true">SO</span><span><strong>Sam Okafor</strong><span>@sam</span></span></li></ul>
  </div>
  <p id="lt-mention-hint" data-part="hint">@ opens the list · ↑↓ to choose · Enter or Tab to insert</p>
</div>
