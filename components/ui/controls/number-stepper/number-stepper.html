<div class="lt-stepper" data-lt="number-stepper">
  <label for="lt-step-in">Seats</label>
  <div data-part="control">
    <button type="button" data-part="dec" aria-label="Remove a seat"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <input id="lt-step-in" type="number" inputmode="numeric" min="1" max="50" step="1" value="5">
    <button type="button" data-part="inc" aria-label="Add a seat"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</div>
