<fieldset class="lt-color" data-lt="color-picker">
  <legend>Label colour</legend>
  <div data-part="swatches"><label data-part="swatch" style="--sw: #5b6472"><input type="radio" name="lt-label-color" value="#5b6472"><span class="lt-visually-hidden">Slate</span></label><label data-part="swatch" style="--sw: #2f6fb0"><input type="radio" name="lt-label-color" value="#2f6fb0" checked><span class="lt-visually-hidden">Ocean</span></label><label data-part="swatch" style="--sw: #1f8a7a"><input type="radio" name="lt-label-color" value="#1f8a7a"><span class="lt-visually-hidden">Teal</span></label><label data-part="swatch" style="--sw: #5c8a3a"><input type="radio" name="lt-label-color" value="#5c8a3a"><span class="lt-visually-hidden">Moss</span></label><label data-part="swatch" style="--sw: #c98a1b"><input type="radio" name="lt-label-color" value="#c98a1b"><span class="lt-visually-hidden">Amber</span></label><label data-part="swatch" style="--sw: #c0623f"><input type="radio" name="lt-label-color" value="#c0623f"><span class="lt-visually-hidden">Clay</span></label><label data-part="swatch" style="--sw: #c04a6b"><input type="radio" name="lt-label-color" value="#c04a6b"><span class="lt-visually-hidden">Rose</span></label><label data-part="swatch" style="--sw: #7357b8"><input type="radio" name="lt-label-color" value="#7357b8"><span class="lt-visually-hidden">Violet</span></label></div>
  <div data-part="custom">
    <span data-part="chip" aria-hidden="true"></span>
    <label for="lt-color-hex" class="lt-visually-hidden">Hex colour</label>
    <input id="lt-color-hex" type="text" value="#2f6fb0" spellcheck="false" autocomplete="off" maxlength="7" aria-describedby="lt-color-msg">
    <span data-part="preview"><span data-part="tag">Design review</span></span>
  </div>
  <p id="lt-color-msg" data-part="msg" aria-live="polite"></p>
</fieldset>
