<form class="lt-form-demo" data-lt="text-field" novalidate>
  <div class="lt-field">
    <input id="lt-tf-email" type="email" required placeholder=" " autocomplete="email" aria-describedby="lt-tf-email-msg">
    <label for="lt-tf-email">Work email</label>
    <span data-part="valid" aria-hidden="true"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
    <p id="lt-tf-email-msg" data-part="message" data-help="We'll send the invite here.">We'll send the invite here.</p>
  </div>
  <div class="lt-field">
    <input id="lt-tf-name" type="text" required minlength="2" placeholder=" " autocomplete="organization" aria-describedby="lt-tf-name-msg">
    <label for="lt-tf-name">Company name</label>
    <span data-part="valid" aria-hidden="true"><svg class="lt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
    <p id="lt-tf-name-msg" data-part="message" data-help="As it appears on invoices.">As it appears on invoices.</p>
  </div>
</form>
