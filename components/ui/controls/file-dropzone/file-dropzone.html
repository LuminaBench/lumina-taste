<div class="lt-dropzone" data-lt="file-dropzone">
  <label data-part="zone">
    <input type="file" multiple accept=".csv,.json,.png,.jpg,.pdf">
    <span data-part="icon" aria-hidden="true"><svg class="lt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></span>
    <span data-part="title"><strong>Drop files here</strong> or <u>browse</u></span>
    <span data-part="meta">CSV, JSON, PNG, JPG or PDF up to 25 MB</span>
  </label>
  <ul data-part="files" aria-label="Selected files"></ul>
</div>
