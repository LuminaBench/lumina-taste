<section class="lt-newsletter-signup" aria-labelledby="lt-ns-title" data-lt="newsletter-signup">
  <div data-part="copy"><h2 id="lt-ns-title">One email a month</h2><p data-part="lede">What we shipped, one chart worth stealing, and nothing else.</p></div>
  <form data-part="form" novalidate>
    <label for="lt-ns-email" class="lt-visually-hidden">Email address</label>
    <div data-part="row"><input id="lt-ns-email" type="email" name="email" placeholder="you@company.com" autocomplete="email" required aria-describedby="lt-ns-msg"><button type="submit" class="lt-btn" data-variant="primary">Subscribe</button></div>
    <p id="lt-ns-msg" data-part="msg" aria-live="polite">No spam. Unsubscribe in one click.</p>
  </form>
</section>
